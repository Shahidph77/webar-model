<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BIM WebAR Model</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body{
      margin:0;
      background:#f5f5f5;
    }

    model-viewer{
      width:100vw;
      height:100vh;
    }
  </style>
</head>

<body>

<model-viewer
src="glbmdl.glb"
ar
ar-modes="webxr scene-viewer quick-look"
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

</body>
</html>
